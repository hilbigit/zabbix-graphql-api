# Source: https://www.zabbix.com/documentation/7.4/en/manual/api/reference/user/get

### Query
```graphql
query GetUserPermissions($objectNames: [String!]) {
  userPermissions(objectNames: $objectNames) {
    objectName
    permission
  }
}
```

### Variables
```json
{
  "objectNames": ["Read-Only-Access"]
}
```
