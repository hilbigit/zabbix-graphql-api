# Source: https://www.zabbix.com/documentation/7.4/en/manual/api/reference/hostgroup/create

### Query
```graphql
mutation ImportHostGroups($hostGroups: [CreateHostGroup!]!) {
  importHostGroups(hostGroups: $hostGroups) {
    groupName
    groupid
    message
  }
}
```

### Variables
