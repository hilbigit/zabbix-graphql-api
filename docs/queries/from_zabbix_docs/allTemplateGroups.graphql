# Source: https://www.zabbix.com/documentation/7.4/en/manual/api/reference/templategroup/get

### Query
```graphql
query GetAllTemplateGroups($name_pattern: String) {
  allTemplateGroups(name_pattern: $name_pattern) {
    groupid
    name
  }
}
```

### Variables
```json
{
  "name_pattern": "Templates%"
}
```
