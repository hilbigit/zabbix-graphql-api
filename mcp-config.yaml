endpoint: http://zabbix-graphql-api:4000/graphql
overrides:
  mutation_mode: all
transport:
  type: streamable_http
  stateful_mode: false
operations:
  source: local
  paths:
    - /mcp/operations
schema:
  source: local
  path: /mcp-data/schema.graphql
introspection:
  execute:
    enabled: true
  introspect:
    enabled: true
  search:
    enabled: true
logging:
  level: ${MCP_LOG_LEVEL:-info}
  parameters: ${MCP_LOG_PARAMETERS:-false}
  responses: ${MCP_LOG_RESPONSES:-false}
