        name: 'Hilbig IT GmbH'
        version: 2.1.1
      templates:
        - name: ROADWORK_DEVICE
      groups:
        - name: Templates/Roadwork/Devices
      items:
        - uuid: d4d3ec9f3ca940a39a721b6cfd2f3471
          name: location
          type: DEPENDENT
          key: location
          history: 2d
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj=JSON.parse(value);
                  
                  if (obj["isFiltered"]) {
                    throw "Result is filtered";
                    return "filtered";
                  }
                  
                  return value;
            - type: NOT_MATCHES_REGEX
              parameters:
                - filtered
              error_handler: DISCARD_VALUE
          master_item:
            key: 'mqtt.get["tcp://mqtt-broker:1883","deviceValue/location"]'
        - uuid: 380c4a7d752848cba3b5a59a0f9b13c0
          name: MQTT_LOCATION
          type: TRAP
          key: 'mqtt.get["tcp://mqtt-broker:1883","deviceValue/location"]'
          history: '0'
          value_type: TEXT
        - uuid: 29faf53c033840c0b1405f8240e30312
          name: coords
          type: DEPENDENT
          key: state.current.values.coords
          history: 2d
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj=JSON.parse(value);
                  var location = obj["location"];
                  var coords = location["coords"];
                  return JSON.stringify({
                  	"btDeviceKey": obj["btDeviceKey"],
                  	"timestamp": location["timestamp"],
                      "deviceName": obj["deviceName"],
                  	"latitude": coords[1],
                  	"longitude": coords[0],
                  	"coords": coords
                  });
          master_item:
            key: location
          tags:
            - tag: hasValue
              value: 'true'
        - uuid: 1ae9486c18394e56b114c9cb4546deaf
          name: geojson
          type: DEPENDENT
          key: state.current.values.geojson
          history: 2d
          value_type: TEXT
          preprocessing:
