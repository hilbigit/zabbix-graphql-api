mutation CreateVerificationHost($deviceKey: String!, $deviceType: String!, $groupNames: [String!]!, $templateNames: [String]) {
  importHosts(hosts: [{
    deviceKey: $deviceKey,
    deviceType: $deviceType,
    groupNames: $groupNames,
    templateNames: $templateNames
  }]) {
    hostid
    message
    error {
      message
    }
  }
}
