services:
  zabbix-graphql-api:
    build:
      context: .
      args:
        - API_VERSION=1.0.0
    ports:
      - "4001:4000"
    env_file:
      - .env
    environment:
      - SCHEMA_PATH=/usr/app/dist/schema/
      - ZABBIX_DEVELOPMENT_TOKEN=${ZABBIX_DEVELOPMENT_TOKEN}
      - VERBOSITY=${VERBOSITY:-0}
      - VERBOSITY_PARAMETERS=${VERBOSITY_PARAMETERS:-0}
      - VERBOSITY_RESPONSES=${VERBOSITY_RESPONSES:-0}
      - LOG_LEVELS=${LOG_LEVELS:-INFO}
    volumes:
      - ./samples:/usr/app/dist/samples

  apollo-mcp-server:
    image: ghcr.io/apollographql/apollo-mcp-server:${APOLLO_MCP_SERVER_VERSION:-v1.7.0}
    ports:
      - "3000:3000"
    volumes:
      - ./mcp-config.yaml:/mcp-config.yaml
      - mcp-shared:/mcp-data:ro
      - ./mcp/operations:/mcp/operations
    command: /mcp-config.yaml
    environment:
      - APOLLO_GRAPH_REF=local@main
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-info}
      # Note: MCP_LOG_PARAMETERS and MCP_LOG_RESPONSES are deprecated and not supported by apollo-mcp-server v1.7.0+
      # Detailed logging is handled by the zabbix-graphql-api service via the VERBOSITY variable.
    depends_on:
      schema-gen:
        condition: service_completed_successfully
      zabbix-graphql-api:
        condition: service_started

  schema-gen:
    image: alpine
    volumes:
      - ./schema:/schema:ro
      - mcp-shared:/mcp-data
    command: sh -c "cat /schema/*.graphql > /mcp-data/schema.graphql"

  zabbix-db:
    image: postgres:16-alpine
    profiles:
      - zabbix-local
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
    volumes:
      - zbx_db_data:/var/lib/postgresql/data

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:${ZABBIX_VERSION:-alpine-7.0-latest}
    profiles:
      - zabbix-local
    ports:
      - "10051:10051"
    environment:
      - DB_SERVER_HOST=zabbix-db
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
      - ZBX_ALLOWUNSUPPORTEDDBVERSIONS=1
    depends_on:
      - zabbix-db

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:${ZABBIX_VERSION:-alpine-7.0-latest}
    profiles:
      - zabbix-local
    ports:
      - "8080:8080"
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - DB_SERVER_HOST=zabbix-db
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
      - PHP_TZ=UTC
      - ZBX_ALLOWUNSUPPORTEDDBVERSIONS=1
    depends_on:
      - zabbix-db
      - zabbix-server

volumes:
  mcp-shared:
  zbx_db_data:
